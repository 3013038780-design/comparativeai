name: Deploy to Cloudflare Workers

# Fires on every push to main. Only used as a fallback if Cloudflare's
# native GitHub integration isn't auto-building (e.g. if the Workers
# project isn't connected to this repo on main branch).
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN — create at
#     https://dash.cloudflare.com/profile/api-tokens
#     (template: "Edit Cloudflare Workers" or custom with
#      Account → Workers Scripts: Edit, Account → Workers R2 Storage: Edit)
#   CLOUDFLARE_ACCOUNT_ID — find at
#     https://dash.cloudflare.com → right sidebar

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Verify CF auth (diagnostic)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}  (expected ≈40)"
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}  (expected 32, hex)"
          echo "Account ID format check:"
          if [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "  ✓ matches 32-hex-char account ID pattern"
          else
            echo "  ✗ DOES NOT match 32-hex pattern — likely wrong value (Zone ID, not Account ID)"
          fi
          echo "---"
          echo "Calling Cloudflare /user/tokens/verify:"
          curl -sS -o /tmp/verify.json -w "HTTP %{http_code}\n" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          cat /tmp/verify.json | python3 -m json.tool
          echo "---"
          echo "Calling Cloudflare /accounts/:id (visibility check):"
          curl -sS -o /tmp/account.json -w "HTTP %{http_code}\n" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          cat /tmp/account.json | python3 -m json.tool

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
