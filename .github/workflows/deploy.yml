name: Deploy to Cloudflare Workers

# Fires on every push to main. Only used as a fallback if Cloudflare's
# native GitHub integration isn't auto-building (e.g. if the Workers
# project isn't connected to this repo on main branch).
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN — create at
#     https://dash.cloudflare.com/profile/api-tokens
#     (template: "Edit Cloudflare Workers" or custom with
#      Account → Workers Scripts: Edit, Account → Workers R2 Storage: Edit)
#   CLOUDFLARE_ACCOUNT_ID — find at
#     https://dash.cloudflare.com → right sidebar

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
